name: flutter_bio_auth
description: >
  Modular, AI-powered on-device face intelligence, 1:1 face recognition,
  active liveness, facial expressions, delivery partner compliance (Zepto/helmet/uniform),
  and local device biometrics for Flutter.
version: 0.2.1

homepage: https://github.com/bvkbbflutter/flutter_bio_auth
repository: https://github.com/bvkbbflutter/flutter_bio_auth
issue_tracker: https://github.com/bvkbbflutter/flutter_bio_auth/issues

environment:
  # Compatible with the Dart SDK shipped by Flutter 3.24.3.
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  crypto: ^3.0.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2

flutter:
  plugin:
    platforms:
      android:
        package: com.vinay.flutter_bio_auth
        pluginClass: FaceBiometricPlugin
      ios:
        pluginClass: FaceBiometricPlugin
  # Ship no default model assets. Consumers point FaceBiometricConfig at
  # their own bundled model via their OWN app's asset declarations; the
  # plugin itself declares nothing here so it never ships fake weights.
  assets:
    - assets/models/mobilefacenet.tflite
    - assets/images/