group 'com.vinay.flutter_bio_auth'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.vinay.flutter_bio_auth'
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Face detection: bundled via Google Play services, no separate
    // model download required by the consuming app.
    implementation 'com.google.mlkit:face-detection:16.1.7'

    // Camera pipeline.
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // Optional recognition/anti-spoof model runtime. Only exercised if
    // the developer configures embeddingModelAssetPath /
    // antiSpoofModelAssetPath; otherwise those engines report
    // modelUnavailable and no TFLite interpreter is ever created.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

    // Device biometric prompt (system biometrics, distinct from this
    // plugin's custom face recognition).
    implementation 'androidx.biometric:biometric:1.1.0'

    // EXIF orientation handling for still images in gallery/camera compare
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}
